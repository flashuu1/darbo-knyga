name: CI
on:
  pull_request:
  push:
    branches: [main]
defaults:
  run:
    working-directory: vizitai
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: vizitai/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run scan:bundle
      # The browser (e2e) tests run on the developer machine before each push: npm run e2e
